name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: Gita

      - name: Run Lint
        run: ./gradlew lint --no-daemon
        working-directory: Gita

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: Gita

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: Gita

      - name: Get APK Version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' Gita/app/build.gradle || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: .

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gita-debug-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: Gita/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Gita/app/build/test-results/**/*.xml
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: Gita/app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Comment PR with APK Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 Build Complete!
            
            ✅ Lint passed
            ✅ Unit tests passed
            ✅ APK built successfully
            
            Download the debug APK from the **Artifacts** section of this workflow run.`
            })
